<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <link id="favicon" rel="icon" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#E50914" />
    <meta name="description" content="بابا المجال — أدوات منزلية، مستلزمات مطبخ، مفروشات وأجهزة كهربائية بأفضل الأسعار في مصر." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link id="font-link" href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800;900&display=swap" rel="stylesheet" />
    <title>بابا المجال | baba-el-magal</title>

    <!-- Tailwind (CDN). الألوان والخط والعرض متغيرات CSS بيغيرها الأدمن من الإعدادات (ThemeManager) -->
    <script src="https://cdn.tailwindcss.com/3.4.17"></script>
    <script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              brand: {
                DEFAULT: "rgb(var(--brand) / <alpha-value>)",
                dark: "rgb(var(--brand-dark) / <alpha-value>)",
                2: "rgb(var(--brand-2) / <alpha-value>)",
              },
              base: "rgb(var(--bg) / <alpha-value>)",
              deep: "rgb(var(--surface-2) / <alpha-value>)",
              card: "rgb(var(--surface) / <alpha-value>)",
              // النصوص — بتتقلب بين الوضع الغامق والفاتح
              ink: {
                DEFAULT: "rgb(var(--ink) / <alpha-value>)",
                1: "rgb(var(--ink-1) / <alpha-value>)",
                2: "rgb(var(--ink-2) / <alpha-value>)",
                3: "rgb(var(--ink-3) / <alpha-value>)",
              },
              muted: "rgb(var(--muted) / <alpha-value>)",
              faint: "rgb(var(--faint) / <alpha-value>)",
              fainter: "rgb(var(--fainter) / <alpha-value>)",
              faintest: "rgb(var(--faintest) / <alpha-value>)",
            },
            maxWidth: { site: "var(--container)" },
            gridTemplateColumns: { products: "repeat(var(--cols), minmax(0, 1fr))" },
            fontFamily: { sans: ["var(--font-body)", "sans-serif"] },
          },
        },
      };
    </script>
    <!-- تطبيق الوضع (غامق/فاتح) قبل ظهور الصفحة عشان مايحصلش وميض -->
    <script>
      (function () {
        var dark = true;
        try {
          var saved = localStorage.getItem("theme");
          var db = JSON.parse(localStorage.getItem("bem_db") || "{}");
          var mode = (db.settings && db.settings.theme && db.settings.theme.defaultMode) || "dark";
          if (saved) dark = saved === "dark";
          else if (mode === "system") dark = matchMedia("(prefers-color-scheme: dark)").matches;
          else dark = mode === "dark";
        } catch (e) {}
        document.documentElement.classList.toggle("dark", dark);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
